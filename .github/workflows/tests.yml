name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      python_versions_output: ${{ steps.set-matrix.outputs.python_versions }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: set-matrix
        run: |
          python_versions=$(sed -n "s/^.*Programming Language :: Python :: \([[:digit:]]\+\.[[:digit:]]\+\).*$/'\1', /p" pyproject.toml | tr -d '\n' | sed 's/, $//g')
          echo "Supported Python versions: $python_versions"
          echo "python_versions=[$python_versions]" >> "$GITHUB_OUTPUT"

  mysql-ubuntu:
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      # TODO: default fail-fast to true; run full matrix with label or workflow-dispatch
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.define-matrix.outputs.python_versions_output) }}
    timeout-minutes: 60
    services:
      mysql:
        # TODO: Match MySQL version to Django's minimum supported version?
        # TODO: Or matrix supported MySQL versions?
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            tests/requirements/mysql.txt
            tests/requirements/py3.txt
      - name: Install system packages
        run: |
          sudo apt update
          xargs -a .github/workflows/data/apt-packages.txt sudo apt install -y --no-install-recommends
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - name: Install test requirements
        run: python -m pip install -r tests/requirements/mysql.txt -r tests/requirements/py3.txt -e .
      - name: Create test settings file
        run: mv ./.github/workflows/data/test_mysql.py.tpl ./tests/test_mysql.py
      - name: Run tests
        env:
          PYTHONPATH: ./tests
        run: python -Wall tests/runtests.py --settings test_mysql -v2

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version:
          - '3.15'
    name: Windows, SQLite, Python ${{ matrix.python-version }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3.txt'
      - name: Install gettext
        shell: pwsh
        run: |
          choco install gettext --no-progress -y
          "$env:ProgramFiles\gettext-iconv\bin" >> $env:GITHUB_PATH
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3.txt -e .
      - name: Run tests
        run: python -Wall tests/runtests.py -v2

  ubuntu-free-threading:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.15t'
    name: Ubuntu, SQLite, Python ${{ matrix.python-version }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3-free-threading.txt'
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3-free-threading.txt -e .
      - name: Show GIL status
        run: python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"
      - name: Run tests
        run: python -Wall tests/runtests.py -v2

  javascript-tests:
    runs-on: ubuntu-latest
    name: JavaScript tests
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Transitive dependency of puppeteer (extract-zip) broken on 24.16
          # https://github.com/puppeteer/puppeteer/issues/15071
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: '**/package.json'
      - run: npm install
      - run: npm test

  scripts-tests:
    runs-on: ubuntu-latest
    name: Scripts tests
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - run: python -m unittest discover -v -s scripts/
